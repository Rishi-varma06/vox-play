[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxplay"
version = "0.1.0"
description = "AI cricket commentary engine — structured ball data → natural audio commentary"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "chess>=1.11",
    "pydantic>=2.0",
    "requests>=2.31",
    "gtts>=2.3",
    "pydub>=0.25",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "httpx>=0.27",
]

[project.scripts]
voxplay = "voxplay.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["voxplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
